version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /services/contratos
      - /services/flash-sales
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /services/contratos
      - /services/flash-sales
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
