kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: atividade-devops
networking:
  disableDefaultCNI: true
  podSubnet: 10.244.0.0/16
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8081
        protocol: TCP
      - containerPort: 30090
        hostPort: 9091
        protocol: TCP
      - containerPort: 30300
        hostPort: 3001
        protocol: TCP
  - role: worker
  - role: worker
