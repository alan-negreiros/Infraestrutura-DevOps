apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apis

labels:
  - pairs:
      app.kubernetes.io/part-of: atividade-devops
    includeSelectors: false

resources:
  - namespace.yaml
  - ../../config
  - network-policies.yaml
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - redis/statefulset.yaml
  - redis/service.yaml
  - contratos/deployment.yaml
  - contratos/service.yaml
  - contratos/hpa.yaml
  - contratos/pdb.yaml
  - flash-sales/deployment.yaml
  - flash-sales/service.yaml
  - flash-sales/hpa.yaml
  - flash-sales/pdb.yaml
  - flash-sales/export-deployment.yaml
  - flash-sales/export-service.yaml
  - flash-sales/export-hpa.yaml
  - gateway/deployment.yaml
  - gateway/service.yaml
  - gateway/hpa.yaml
  - gateway/pdb.yaml
  - monitoring/prometheus-rbac.yaml
  - monitoring/prometheus.yaml
  - monitoring/grafana.yaml

configMapGenerator:
  - name: contratos-config
    literals:
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=contracts_db
      - DB_USER=contratos
      - REDIS_HOST=redis
      - REDIS_PORT=6379
  - name: flash-sales-config
    literals:
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=flash_sales
      - DB_USER=flash_sales
      - REDIS_HOST=redis
      - REDIS_PORT=6379
