apiVersion: batch/v1
kind: Job
metadata:
  name: redis-seed
  labels:
    app.kubernetes.io/name: redis-seed
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-seed
        redis-client: "true"
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until redis-cli -h redis ping | grep -q PONG; do sleep 2; done
              redis-cli -h redis SET "event:${EVENT_ID}:tickets" "${EVENT_TICKETS}" NX
              redis-cli -h redis SET "event:${LOAD_EVENT_ID}:tickets" "${LOAD_EVENT_TICKETS}" NX
              echo "Estoque de event:${EVENT_ID}:tickets = $(redis-cli -h redis GET "event:${EVENT_ID}:tickets")"
              echo "Estoque de event:${LOAD_EVENT_ID}:tickets = $(redis-cli -h redis GET "event:${LOAD_EVENT_ID}:tickets")"
          env:
            - name: EVENT_ID
              value: show-2026
            - name: EVENT_TICKETS
              value: "1000"
            - name: LOAD_EVENT_ID
              value: show-carga
            - name: LOAD_EVENT_TICKETS
              value: "100000"
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: apis-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
